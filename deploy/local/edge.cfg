#
# Forwards 127.0.0.1:3000 on this machine to the app, so a browser can look at
# the rehearsal (the app's own network has no egress and publishes nothing).
# Plain TCP: this is not FDM, which terminates TLS and appends X-Forwarded-For.

global
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver dns 127.0.0.11:53

frontend web
    bind :3000
    default_backend app

backend app
    server app fluxapp_quipfeedback:3000 resolvers docker init-addr none
